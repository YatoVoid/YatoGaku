<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Quiz Practice - YatoGaku</title>
    <meta name="description" content="Free JLPT and HSK practice. Flashcards, multiple choice, kana typing, grammar, and kanji quizzes." />

    <!-- Google Fonts preconnect -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Open Graph -->
    <meta property="og:title" content="Quiz Practice - YatoGaku" />
    <meta property="og:description" content="Free JLPT and HSK practice. Flashcards, multiple choice, kana typing, grammar, and kanji quizzes." />
    <meta property="og:image" content="https://yatovoid.github.io/YatoGaku/apps/quiz/og-image.png" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://yatovoid.github.io/YatoGaku/apps/quiz/" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Quiz Practice - YatoGaku" />
    <meta name="twitter:description" content="Free JLPT and HSK practice." />
    <meta name="twitter:image" content="https://yatovoid.github.io/YatoGaku/apps/quiz/og-image.png" />

    <!-- Canonical -->
    <link rel="canonical" href="https://yatovoid.github.io/YatoGaku/apps/quiz/" />

    <link rel="icon" href="%sveltekit.assets%/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#8b4fe6" />
    <link rel="apple-touch-icon" href="%sveltekit.assets%/icon-192.png" />
    <link rel="manifest" href="%sveltekit.assets%/manifest.json" />
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <script>
      try {
        var s = JSON.parse(localStorage.getItem('ui-store') || '{}');
        if (s.darkMode) document.documentElement.classList.add('dark');
      } catch(e) {}
    </script>
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
